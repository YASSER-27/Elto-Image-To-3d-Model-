<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ElTo</title>
<style>
  :root{
    --bg:#111111; --bg-panel:#161616; --bg-raised:#1c1c1c;
    --border:#2a2a2a; --border-soft:#202020;
    --text:#e8e8e8; --text-dim:#8a8a8a; --text-faint:#5a5a5a;
    --accent:#38bdf8; --accent-hover:#5cc9fa; --accent-soft:rgba(56,189,248,.14);
    --warn:#f6ad55;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:'Segoe UI',sans-serif;overflow:hidden;}
  #root{display:flex;height:100%;}

  #sidebar{width:240px;min-width:180px;max-width:320px;background:var(--bg-panel);
    padding:12px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;}
  #sidebar h1{font-size:14px;margin:0;font-weight:700;}
  #sidebar .tagline{font-size:9px;color:var(--text-dim);margin:1px 0 0;}
  hr{border:none;border-top:1px solid var(--border-soft);width:100%;margin:0;}
  .group-label{font-size:10px;font-weight:600;color:var(--text-dim);margin:4px 0 2px;}
  .field-caption{font-size:9px;color:var(--text-dim);margin:6px 0 2px;}

  #dropzone{min-height:80px;background:var(--bg-raised);border:1px dashed var(--border);
    border-radius:6px;display:flex;align-items:center;justify-content:center;
    text-align:center;color:var(--text-faint);font-size:10px;padding:6px;cursor:pointer;
    background-size:cover;background-position:center;}
  #dropzone.drag{background-color:#1e2a2e;border:1.5px dashed var(--accent);color:var(--accent);}

  .row{display:flex;gap:6px;}
  button{font-family:inherit;cursor:pointer;}
  .btn{background:var(--bg-raised);color:var(--text);border:1px solid var(--border);
    border-radius:5px;padding:5px 8px;font-size:11px;font-weight:600;min-height:26px;flex:1;}
  .btn:hover:not(:disabled){border-color:var(--accent);background:var(--border-soft);}
  .btn:disabled{color:var(--text-faint);border-color:var(--border-soft);}
  .btn-edit{background:var(--bg-raised);color:var(--text-dim);border:1px solid var(--border-soft);
    flex:0 0 auto;display:none;}
  .btn-edit:hover{border-color:var(--accent);color:var(--accent);}
  .btn-primary{background:var(--bg-raised);color:var(--accent);border:1.5px solid var(--accent);width:100%;}
  .btn-primary:hover:not(:disabled){background:var(--accent-soft);border-color:var(--accent-hover);}
  .btn-primary:disabled{color:var(--text-faint);border-color:var(--border-soft);}
  .btn-output{background:var(--bg-raised);color:var(--warn);border:1.5px solid var(--warn);
    width:100%;text-align:left;margin-bottom:4px;}
  .btn-output:disabled{color:var(--text-faint);border-color:var(--border-soft);}

  .radio-row{display:flex;flex-direction:column;gap:4px;}
  .radio-row.horiz{flex-direction:row;gap:3px;}
  .radio-btn{background:var(--bg-raised);color:var(--text-dim);border:1px solid var(--border-soft);
    border-radius:5px;padding:4px 6px;font-size:10px;font-weight:600;text-align:left;flex:1;min-height:22px;}
  .radio-row.horiz .radio-btn{text-align:center;font-size:9px;padding:3px 0;}
  .radio-btn.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
  .radio-btn:hover:not(.active){border-color:var(--accent);color:var(--text);}

  #genRow{display:flex;align-items:center;gap:6px;margin-top:2px;}
  #spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--border);
    border-top-color:var(--accent);display:none;animation:spin 0.8s linear infinite;flex:0 0 auto;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #progressText{font-size:9px;color:var(--text-dim);}

  #footer{margin-top:auto;display:flex;flex-direction:column;gap:2px;}
  #statusLabel{font-size:9px;color:var(--text-dim);}
  #deviceLabel{font-size:8px;color:var(--text-faint);}

  #viewerPanel{flex:1;padding:8px;}
  #viewerFrame{width:100%;height:100%;border:1px solid var(--border);border-radius:6px;background:var(--bg);}

  #cropModal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;
    align-items:center;justify-content:center;z-index:50;}
  #cropBox{background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;padding:14px;}
  #cropCanvas{background:#000;cursor:crosshair;max-width:80vw;max-height:70vh;display:block;}
  #cropButtons{display:flex;gap:8px;margin-top:10px;justify-content:flex-end;}
</style>
</head>
<body>
<div id="root">
  <div id="sidebar">
    <div>
      <h1>ElTo</h1>
      <p class="tagline">Image -&gt; 3D model</p>
    </div>
    <hr>

    <div class="group-label">INPUT</div>
    <input type="file" id="fileInput" accept=".png,.jpg,.jpeg,.webp,.bmp,.gif" style="display:none">
    <div id="dropzone">Import / Drag / Paste here</div>
    <div class="row">
      <button class="btn" id="btnImport">Import Image</button>
      <button class="btn btn-edit" id="btnEdit">&#9998; Edit</button>
    </div>

    <div class="group-label">GENERATE</div>
    <div class="field-caption">Quality</div>
    <div class="radio-row" id="qualityRow">
      <button class="radio-btn active" data-idx="0">Fast</button>
      <button class="radio-btn active" data-idx="1">Balanced</button>
      <button class="radio-btn" data-idx="2">High</button>
      <button class="radio-btn" data-idx="3">Ultra</button>
    </div>

    <div class="field-caption">Decimate</div>
    <div class="radio-row horiz" id="decimateRow">
      <button class="radio-btn active" data-val="100">Off</button>
      <button class="radio-btn" data-val="10">10%</button>
      <button class="radio-btn" data-val="25">25%</button>
      <button class="radio-btn" data-val="50">50%</button>
      <button class="radio-btn" data-val="75">75%</button>
      <button class="radio-btn" data-val="100">100%</button>
    </div>

    <div class="field-caption">Smooth</div>
    <div class="radio-row horiz" id="smoothRow">
      <button class="radio-btn active" data-val="0">Off</button>
      <button class="radio-btn" data-val="2">10%</button>
      <button class="radio-btn" data-val="5">25%</button>
      <button class="radio-btn" data-val="10">50%</button>
      <button class="radio-btn" data-val="15">75%</button>
      <button class="radio-btn" data-val="20">100%</button>
    </div>

    <button class="btn-primary" id="btnGenerate" disabled>Generate 3D Model</button>
    <div id="genRow">
      <div id="spinner"></div>
      <div id="progressText">Loading model...</div>
    </div>

    <div class="group-label">OUTPUT</div>
    <a class="btn btn-output" id="btnSaveObj" style="pointer-events:none;opacity:.5;">Save OBJ</a>
    <a class="btn btn-output" id="btnSaveGlb" style="pointer-events:none;opacity:.5;">Save GLB</a>
    <a class="btn btn-output" id="btnSaveGltf" style="pointer-events:none;opacity:.5;">Save GLTF</a>
    <button class="btn btn-output" id="btnOpenGlb">Open .glb</button>
    <button class="btn btn-output" id="btnOpenGltf">Open .gltf</button>
    <input type="file" id="openMeshInput" accept=".glb,.gltf" style="display:none">

    <div id="footer">
      <hr style="margin-bottom:6px;">
      <div id="statusLabel">Starting up...</div>
      <div id="deviceLabel">Device: detecting...</div>
    </div>
  </div>

  <div id="viewerPanel">
    <iframe id="viewerFrame" src="/api/viewer/placeholder"></iframe>
  </div>
</div>

<div id="cropModal">
  <div id="cropBox">
    <canvas id="cropCanvas" width="600" height="450"></canvas>
    <div id="cropButtons">
      <button class="btn" id="btnCropCancel">Cancel</button>
      <button class="btn btn-primary" id="btnCropApply">Apply Crop</button>
    </div>
  </div>
</div>

<script src="/static/crop.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
